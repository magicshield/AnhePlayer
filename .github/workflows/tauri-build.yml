name: Tauri Build & Release

on:
  # 发版仅由推标签触发；dispatch 只做验证构建，不再保留易误发的 release 开关
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify release/version.json matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL=$(node -p "require('./release/version.json').version")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::release/version.json 的 version ($ACTUAL) 与标签 ($EXPECTED) 不一致，请先更新 release/version.json 再打标签"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅标签构建创建 Release；dispatch 构建只出 artifact，避免误建 master 标签/发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('AnhePlayer {0}', github.ref_name) || '' }}
          releaseBody: 'AnhePlayer Tauri v2 Release'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: AnhePlayer-Tauri-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Generate release notes from version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: node ./scripts/gen-release-notes.mjs

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 标签构建下 ref_name 即版本标签，不再回退到旧版本号误发
          tag_name: ${{ github.ref_name }}
          name: ${{ format('AnhePlayer {0}', github.ref_name) }}
          body_path: ./release-notes.md
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

