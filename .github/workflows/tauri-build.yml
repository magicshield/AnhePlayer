name: Tauri Build & Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish GitHub Release if checked'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AnhePlayer ${{ github.ref_name }}'
          releaseBody: 'AnhePlayer Tauri v2 Release'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: AnhePlayer-Tauri-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.17' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('AnhePlayer {0}', github.ref_name) || 'AnhePlayer v1.0.17' }}
          body: |
            ### AnhePlayer Tauri v2 Release 🎉
            - 全新轻量化 Tauri v2 核心驱动，超低内存占用与秒级启动
            - Web Worker 隔离沙箱与网络跨域穿透，全面兼容洛雪音源插件
            - 保持原有 UI 与歌单数据完全兼容
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

